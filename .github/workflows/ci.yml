name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build ./nixos

  # Ubuntu WSL: wsl/install (apt + stow), run twice to check it's re-runnable
  wsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          docker run --rm -v "$PWD":/src:ro ubuntu:26.04 bash -c '
            set -e
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo >/dev/null
            useradd -m tom && echo "tom ALL=(ALL) NOPASSWD:ALL" >/etc/sudoers.d/tom
            cp -a /src /home/tom/.dotfiles && chown -R tom:tom /home/tom/.dotfiles
            su - tom -c "set -e; cd ~/.dotfiles
              wsl/install && tests/smoke.sh --plugins
              wsl/install && tests/smoke.sh --plugins"'
